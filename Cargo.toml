[package]
name = "lumaglass"
version = "2.9.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "lumaglass"
license = "MIT"
description = "Native Home replacement for rooted LG webOS TVs"

[workspace]
members = ["crates/vector-geometry", "tools/vector-assets"]
resolver = "3"

[features]
default = []
webos = ["dep:libc"]

[dependencies]
gl = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = { version = "0.2", optional = true }
lumaglass-vector-geometry = { path = "crates/vector-geometry" }
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = { version = "0.49", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Keep on-demand glyph geometry responsive in desktop debug previews.
[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.skrifa]
opt-level = 3

[profile.dev.package.read-fonts]
opt-level = 3
